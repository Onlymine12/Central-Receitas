<style>
/* =========================================================
   IDENTIDADE VISUAL (cores extraídas da página de vendas)
   ========================================================= */
:root{
  --g:#008934;      /* verde principal: títulos, botões, destaques */
  --g-d:#01482A;    /* verde escuro: faixa superior da página */
  --g-l:#EFFBF1;    /* verde muito claro: fundos de seção */
  --g-m:#D3F0DB;
  --ink:#13241A;
  --muted:#5B6B62;
  --line:#E2EEE5;
  --bg:#F7FBF8;
  --card:#FFFFFF;
  --gold:#E9A800;   /* estrelas/selo (hex aproximado) */
  --sh:0 1px 2px rgba(1,72,42,.05),0 6px 18px rgba(1,72,42,.06);
  --sh-lg:0 2px 4px rgba(1,72,42,.06),0 18px 40px rgba(1,72,42,.12);
  --r:20px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 15px/1.5 'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding-bottom:calc(86px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;margin:0;letter-spacing:-.01em}
a{color:inherit}
img{max-width:100%}
svg{flex:none}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}

/* ---------- Header ---------- */
.app-header{
  position:sticky;top:0;z-index:30;
  background:rgba(255,255,255,.9);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);
}
.hdr-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;height:66px;padding:0 16px}
.back{
  width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--g-d);
  display:grid;place-items:center;transition:transform .15s var(--ease),background .2s;
}
.back:active{transform:scale(.92);background:var(--g-l)}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0}
.logo{
  width:42px;height:42px;border-radius:13px;flex:none;color:#fff;display:grid;place-items:center;
  background:linear-gradient(140deg,#0BA548,var(--g) 45%,var(--g-d));
  font:900 14px/1 'Nunito',sans-serif;letter-spacing:-.03em;box-shadow:0 6px 14px rgba(0,137,52,.3);
}
.brand-t{min-width:0}
.brand-t strong{display:block;font:900 16.5px/1.15 'Nunito',sans-serif;color:var(--g-d)}
.brand-t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topnav{display:none;margin-left:auto;gap:4px}
.topnav a{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;text-decoration:none;font:800 14px 'Nunito',sans-serif;color:var(--muted);transition:background .2s,color .2s}
.topnav a:hover{background:var(--g-l);color:var(--g-d)}
.topnav a.on{background:var(--g-l);color:var(--g)}

/* ---------- Bottom nav (mobile) ---------- */
.bnav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);box-shadow:0 -8px 28px rgba(1,72,42,.07);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;text-decoration:none;color:#7A8A81;font:800 11.5px 'Nunito',sans-serif}
.bnav .bi{width:52px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .25s var(--ease),transform .2s}
.bnav a.on{color:var(--g)}
.bnav a.on .bi{background:var(--g-m)}
.bnav a:active .bi{transform:scale(.9)}

@media (min-width:900px){
  .bnav{display:none}
  .topnav{display:flex}
  body{padding-bottom:0}
}

/* ---------- Layout ---------- */
main{max-width:1120px;margin:0 auto;padding:20px 16px 40px}
.screen{animation:enter .42s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sec{margin-top:34px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:20px;font-weight:900;color:var(--g-d)}
.sec-h p{margin:3px 0 0;color:var(--muted);font-size:14px}
.sec-h .more{flex:none;font:800 13.5px 'Nunito',sans-serif;color:var(--g);text-decoration:none;padding:6px 2px}
.page-t{font-size:clamp(24px,6vw,32px);font-weight:900;color:var(--g-d);line-height:1.15}
.page-s{color:var(--muted);margin:6px 0 0;font-size:15px}

/* ---------- Botões ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:0 22px;
  border-radius:15px;border:0;background:var(--g);color:#fff;text-decoration:none;
  font:800 15px 'Nunito',sans-serif;box-shadow:0 10px 22px rgba(0,137,52,.26);
  transition:transform .15s var(--ease),box-shadow .2s,background .2s;
}
.btn:hover{background:#007A2E;box-shadow:0 12px 26px rgba(0,137,52,.32)}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.ghost{background:#fff;color:var(--g-d);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--g-l)}
.btn.ghost.on{background:var(--g-l);border-color:#9ED6AE;color:var(--g)}
.btn.sm{min-height:42px;padding:0 15px;font-size:13.5px;border-radius:12px;box-shadow:none}

/* ---------- Hero da home ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:28px;padding:26px 20px 22px;color:#fff;
  background:
    radial-gradient(90% 120% at 105% -10%,rgba(46,204,113,.55) 0%,transparent 55%),
    radial-gradient(60% 80% at -10% 120%,rgba(233,168,0,.22) 0%,transparent 60%),
    linear-gradient(150deg,#01482A 0%,#016B30 55%,#008934 100%);

.empty{text-align:center;padding:40px 22px;border-radius:24px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.empty .ei{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;background:#FDECEF;color:#E0435A;display:grid;place-items:center}
.empty h3{font-size:19px;font-weight:900;color:var(--g-d)}
.empty p{margin:6px auto 18px;max-width:380px;color:var(--muted)}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:90;transform:translate(-50%,20px);
  width:max-content;max-width:calc(100% - 32px);padding:13px 18px;border-radius:15px;background:#13241A;color:#fff;
  font:700 14px 'Nunito Sans',sans-serif;box-shadow:0 14px 34px rgba(0,0,0,.25);opacity:0;pointer-events:none;
  transition:opacity .25s,transform .3s var(--ease);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){.toast{bottom:28px}}

/* ---------- Tela "Acesso liberado" ---------- */
.welcome{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px 16px;overflow-y:auto;color:#fff;text-align:center;
  background:
    radial-gradient(70% 50% at 50% 0%,rgba(46,204,113,.45),transparent 70%),
    linear-gradient(165deg,#01482A,#006B2C 60%,#008934);
  animation:fade .4s ease both;
}
.welcome.out{animation:fadeOut .35s ease both}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
.wcard{max-width:440px;width:100%}
.badge{position:relative;width:104px;height:104px;margin:0 auto 26px;border-radius:50%;background:#fff;color:var(--g);display:grid;place-items:center;box-shadow:0 18px 40px rgba(0,0,0,.25);animation:badge .7s .15s var(--ease) both}
.badge::before,.badge::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid rgba(255,255,255,.35);animation:ring 2.4s 1s ease-out infinite}
.badge::after{animation-delay:1.8s}
.badge svg{width:52px;height:52px;stroke-width:3}
@keyframes badge{from{transform:scale(.3) rotate(-25deg);opacity:0}}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.5);opacity:0}}
.welcome .k{font:900 12.5px 'Nunito',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#B8F5C9}
.welcome h1{font-size:clamp(30px,8vw,40px);font-weight:900;margin:8px 0 12px;line-height:1.08}
.welcome p{opacity:.92;line-height:1.6;margin:0 0 8px}
.welcome .prod{margin:20px 0 26px;padding:14px;border-radius:17px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font:800 15px 'Nunito',sans-serif}
.welcome .prod small{display:block;font:700 12px 'Nunito Sans',sans-serif;opacity:.8;margin-top:2px}
.welcome .btn{background:#fff;color:var(--g-d);box-shadow:0 14px 30px rgba(0,0,0,.22)}
.spark{position:absolute;width:8px;height:8px;border-radius:2px;opacity:.7;animation:fall 3.6s linear infinite}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Impressão de receita ---------- */
@media print{
  .app-header,.bnav,.no-print,.toast,.welcome{display:none!important}
  body{background:#fff;padding:0}
  main{padding:0}
  .block{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .rhero,.etapa picture{display:none}
  .etapa{grid-template-columns:1fr!important}
}
</style>

<script>

(function(root) {
 'use strict';
 const STORAGE_KEY='365-receitas:lista-de-compras:v1';
 const normalize=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function filterItems(data,query='',category='todas',pending=false,state={}) {
  const q=normalize(query).trim();
  return data.itens.filter(i=>(category==='todas'||i.categoria===category)&&(!pending||!state[i.id]?.comprado)&&(!q||normalize([i.nome,i.como_escolher,i.como_usar].join(' ')).includes(q)));
 }
 function sanitizeState(raw,items) {
  const out={}; if(!raw||typeof raw!=='object')return out;
  for(const item of items){const v=raw[item.id];if(v&&typeof v==='object')out[item.id]={comprado:v.comprado===true,quantidade:typeof v.quantidade==='string'?v.quantidade.slice(0,80):''};}
  return out;
 }
 function listText(data,state,pending=false) {
  const lines=[data.nome,'Quantidades informadas por você; não são porções prescritas.',''];
  for(const cat of data.categorias){const items=data.itens.filter(i=>i.categoria===cat.id&&(!pending||!state[i.id]?.comprado));if(!items.length)continue;lines.push(cat.nome.toUpperCase());for(const i of items)lines.push(`${state[i.id]?.comprado?'[x]':'[ ]'} ${i.nome}${state[i.id]?.quantidade?' — '+state[i.id].quantidade:''}`);lines.push('');}
  lines.push(data.orientacao_principal);return lines.join('\n');
 }

  if(!host||!data?.itens)throw new Error('Informe um elemento e os dados de compras.');
  const assetBase=options.assetBase||'';
  let state={},storageOk=true,storage=options.storage;
  if(storage===undefined){try{storage=root.localStorage;}catch(_){storageOk=false;}}
  try{state=sanitizeState(JSON.parse(storage?.getItem(STORAGE_KEY)||'{}'),data.itens);}catch(_){storageOk=false;}
  let category='todas',query='',pending=false;
  host.classList.add('ce');
  host.innerHTML=`<section class="ce-hero" aria-labelledby="ce-heading"><img class="ce-hero-art" src="${escape(assetBase+data.banner.imagem)}" alt="${escape(data.banner.alt)}"><div class="ce-hero-copy"><span class="ce-eyebrow">SUA DESPENSA, MAIS ORGANIZADA</span><h1 id="ce-heading">${escape(data.banner.titulo)}</h1><p>${escape(data.banner.subtitulo)}</p><a class="ce-button ce-primary" href="#ce-lista">Montar minha lista <span aria-hidden="true">↓</span></a></div></section>
  <div class="ce-body"><section class="ce-intro"><div><span class="ce-eyebrow">LISTA DE COMPRAS ESSENCIAIS</span><h2>Boas escolhas começam<br>com um pouco de planejamento.</h2><p>${escape(data.orientacao_principal)}</p></div><div class="ce-mini-book"><img src="${escape(assetBase+data.capa.imagem)}" alt="${escape(data.capa.alt)}"><div><strong>50 opções</strong><span>8 categorias para facilitar sua ida ao mercado</span></div></div></section>

<script>

 const clampDay=n=>Math.min(30,Math.max(1,Math.trunc(Number(n))||1));
 function menuText(data,selected=null){
  const out=[data.nome,'',data.orientacao_principal,'',data.aviso_saude,'',data.aviso_porcoes,'',data.aviso_lanche,''];
  for(const day of data.dias){if(selected!==null&&day.dia!==clampDay(selected))continue;out.push(day.titulo);for(const m of day.refeicoes)out.push(`${m.rotulo}: ${m.nome}.`);out.push(`Dica: ${day.dica_do_dia}`,'');}
  out.push('Referências:',...data.fontes.map(f=>`${f.titulo}: ${f.url}`));return out.join('\n');
 }
 function mount(host,data,options={}){
  if(!host||!data?.dias)throw Error('Informe o elemento da tela e os dados do cardápio.');

div data-content></div></section><section class="cm-guidance"><span class="cm-eyebrow">PARA VARIAR COM ATENÇÃO</span><h2>Trocas possíveis</h2><p class="cm-muted">As opções abaixo não são equivalências nutricionais nem indicam usar a mesma quantidade.</p><div class="cm-swap-grid">${data.trocas_possiveis.map(s=>`<article><h3>${esc(s.grupo)}</h3><p>${esc(s.opcoes.join(' · '))}</p><small>${esc(s.nota)}</small></article>`).join('')}</div></section><details class="cm-guidelines"><summary>Orientações de preparo e conservação</summary><ul>${data.orientacoes_preparo.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details><details class="cm-guidelines"><summary>Referências e escopo do material</summary><p>Consulta em 22/10/2026. As combinações são uma seleção editorial; as fontes fundamentam orientações gerais, sem certificar os 30 dias.</p><ul>${data.fontes.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.titulo)}</a></li>`).join('')}</ul><p>${esc(data.notas_editoriais[2])}</p></details><footer class="cm-footer">Planejar. Variar. Preparar.<span>Ideias para sua rotina, escolhas de acordo com você.</span></footer></div>`;
  const $=s=>host.querySelector(s);
  function dayHtml(d){return `<article class="cm-day" aria-labelledby="cm-${d.id}"><div class="cm-day-title"><div><span class="cm-eyebrow">${esc(data.blocos[d.bloco-1].rotulo)}</span><h3 id="cm-${d.id}">${esc(d.titulo)}</h3></div><span class="cm-count">3 refeições + 1 opção de lanche</span></div><div class="cm-meal-grid">${d.refeicoes.map((m,i)=>`<section class="cm-meal${m.opcional?' cm-optional':''}"><span class="cm-meal-label"><b>${String(i+1).padStart(2,'0')}</b>${esc(m.rotulo)}</span><h4>${esc(m.nome)}</h4><p class="cm-components">${esc(m.ingredientes.map(x=>x.nome).join(' · '))}</p>${m.opcional?'<p class="cm-snack-note">Uma opção apenas se fizer parte do seu plano alimentar.</p>':''}<details><summary>Ingredientes e observações</summary><p>Ingredientes principais, sem quantidades prescritas:</p><ul>${m.ingredientes.map(x=>`<li>${esc(x.nome)}</li>`).join('')}</ul>${m.alergenicos_observacoes.length?`<p><strong>Alergênicos / rótulo</strong></p><ul>${m.alergenicos_observacoes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<p>Confira ingredientes adicionais, rótulos e contaminação cruzada. Esta sugestão não é uma receita completa ou calculada nutricionalmente.</p></details></section>`).join('')}</div><aside class="cm-tip"><strong>Para lembrar hoje</strong><p>${esc(d.dica_do_dia)}</p></aside></article>`;}
  function render(){
   $('[data-content]').innerHTML=(all?data.dias:[data.dias[day-1]]).map(dayHtml).join('');
   $('[data-status]').textContent=all?'Visão dos 30 dias':`Dia ${String(day).padStart(2,'0')} de 30`;
   $('[data-prev]').disabled=all||day===1;$('[data-next]').disabled=all||day===30;
   $('[data-view]').textContent=all?'Ver um dia por vez':'Ver todos os dias';
   host.querySelectorAll('[data-day]').forEach(b=>{const active=!all&&Number(b.dataset.day)===day;b.setAttribute('aria-pressed',String(active));});
  }
  function click(e){const b=e.target.closest('button');if(!b||!host.contains(b))return;
   if(b.hasAttribute('data-day')){day=clampDay(b.dataset.day);all=false;render();}
   if(b.hasAttribute('data-block')){day=clampDay(b.dataset.block);all=false;render();}
   if(b.hasAttribute('data-prev')){day=clampDay(day-1);render();}if(b.hasAttribute('data-next')){day=clampDay(day+1);render();}

   ========================================================= */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('r365_' + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('r365_' + k, JSON.stringify(v)); }catch(e){} }
};

/* =========================================================
   HELPERS
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const catById = id => CATEGORIAS.find(c => c.id === id);
const recById = id => RECEITAS.find(r => r.id === id);
const plano = () => PLANOS[CONFIG.plano] || PLANOS.basico;
const bonusLiberados = () => CONFIG.plano === 'premium' || CONFIG.bonusNoBasico;
const naCategoria = id => RECEITAS.filter(r => r.categoria === id);
const prontas = () => RECEITAS.filter(r => r.ingredientes && r.ingredientes.length);
const imgOf = r => r.imagem || r.img || '';
const fmt = v => Number(v).toLocaleString('pt-BR', { minimumFractionDigits:1, maximumFractionDigits:1 });

// Cores/ícone do card: os da receita, senão os da categoria
function visual(r){
  const c = catById(r.categoria) || {};
  return { c: r.c || c.c || '#EFFBF1', ci: r.ci || c.ci || '#008934', icone: r.icone || c.icone || 'utensils' };
}

// <picture> com WebP e JPG de reserva (mesmo nome de arquivo)
function pic(src, alt, lazy = true){
  const jpg = /\.webp$/i.test(src) ? src.replace(/\.webp$/i, '.jpg') : '';
  return `<picture>${jpg ? `<source srcset="${esc(src)}" type="image/webp">` : ''}<img src="${esc(jpg || src)}" alt="${esc(alt)}"${lazy ? ' loading="lazy"' : ''}></picture>`;
}

// "368 min (aprox.)" → "6 h 8 min (aprox.)"
function tempoFmt(t){
  const m = String(t).match(/^(\d+)\s*min(.*)$/);
  if (!m || +m[1] < 60) return t;
  const h = Math.floor(m[1] / 60), min = m[1] % 60;
  return `${h} h${min ? ' ' + min + ' min' : ''}${m[2]}`;
}
const rendFmt = t => String(t).replace(/^1 porção\(ões\)/, '1 porção').replace(/porção\(ões\)/, 'porções');

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

// Botão de download padrão. Enquanto o link for "#", mostra um aviso em vez de quebrar.
function dlBtn(arquivo, nomeArquivo, label = 'Baixar', cls = 'btn'){
  return `<a class="${cls}" href="${esc(arquivo)}" data-arquivo="${esc(nomeArquivo)}" target="_blank" rel="noopener">${ic('download', 19)}<span>${label}</span></a>`;
}

/* =========================================================
   COMPONENTES
   ========================================================= */
// Contagem: número real cadastrado no app; sem cadastro, a quantidade anunciada do material para baixar
function qtyLabel(c){
  const n = naCategoria(c.id).length;
  return n ? `${n} ${n === 1 ? 'receita' : 'receitas'} no app` : `${c.qtd} receitas · para baixar`;
}

function catCard(c){
  return `<a class="cat" href="#/categoria/${c.id}" style="--c:${c.c};--ci:${c.ci}">
    <span class="cat-ic${c.capa ? ' foto' : ''}">${c.capa ? `<img src="${esc(c.capa)}" alt="" loading="lazy">` : ic(c.icone, 28)}</span>
    <span class="cat-tx">

    <span class="chev">${ic('chev', 20)}</span>

}

function recCard(r){
  const on = favs.includes(r.id);
  const v = visual(r);
  const kcal = r.nutricao && r.nutricao.por_porcao && r.nutricao.por_porcao.energia_kcal;
  const meta = [r.tempo && `<span>${ic('clock', 13)} ${esc(tempoFmt(r.tempo))}</span>`, kcal != null && `<span>≈ ${fmt(kcal)} kcal/porção</span>`].filter(Boolean).join('');
  return `<a class="rcard" href="#/receita/${r.id}">
    <div class="rimg" style="--c:${v.c};--ci:${v.ci}">
      ${imgOf(r)
        ? pic(imgOf(r), r.nome)
        : `<span class="ph">${ic(v.icone, 40, 1.6)}<small>foto da receita</small></span>` /* TROCAR: foto real em r.imagem */}
      <button class="fav ${on ? 'on' : ''}" data-fav="${r.id}" aria-label="Favoritar">${ic('heart', 19)}</button>
    </div>
    <div class="rbody">
      <h4>${esc(r.nome)}</h4>
      <p>${esc(r.desc)}</p>
      ${meta ? `<span class="rmeta">${meta}</span>` : ''}
      ${done.includes(r.id) ? `<span class="tag-done">${ic('check', 13, 3)} Já preparei</span>` : ''}
    </div>

}

function bookCover(b, lg){
  if (b.capa) return `<img src="${esc(b.capa)}" alt="${esc(b.nome)}" style="max-height:${lg ? 220 : 150}px">`;
  // TROCAR: capa real em BONUS[].capa — abaixo é uma capa desenhada em CSS
  return `<div class="book ${lg ? 'lg' : ''}" style="--bc:${b.cor}"><b>${esc(b.nome)}</b><small>Bônus ${b.n}</small></div>`;
}

function bonusCard(b){
  return `<a class="bcard" href="#/bonus/${b.id}">
    <div class="bcover">${bookCover(b)}</div>
    <div class="bbody">
      <span class="blabel">Bônus ${b.n}</span>
      <h3>${esc(b.nome)}</h3>

// Nutrição por porção (nunca a receita inteira). Nulo = dado ausente, não zero.
function nutriBlock(r){
  const p = r.nutricao.por_porcao;
  const acuc = (catById(r.categoria) || {}).acucares;
  const m = (val, rot) => `<div><b>${val == null ? '—' : fmt(val)}</b><span>${val == null ? 'não disponível' : rot}</span></div>`;
  return `
    <section class="block">
      <h2>${ic('list', 20)} Nutrição estimada por porção</h2>
      ${r.porcao_descricao ? `<p class="fine" style="margin:0 0 4px">Porção: ${esc(r.porcao_descricao)}</p>` : ''}
      ${r.orientacao_porcionamento ? `<p class="fine" style="margin:0 0 4px">${esc(r.orientacao_porcionamento)}</p>` : ''}
      <div class="macros${acuc ? ' seis' : ''}">
        ${m(p.energia_kcal, 'kcal')}
        ${m(p.proteinas_g, 'g proteínas')}
        ${m(p.carboidratos_totais_g, 'g carb. totais USDA')}
        ${m(p.gorduras_totais_g, 'g gorduras')}
        ${m(p.fibras_g, 'g fibras')}
        ${acuc ? m(p.acucares_totais_g, 'g açúcares naturais') : ''}
      </div>
      <p class="fine">Valores estimados: ${esc(r.nutricao.status)}. ${esc(r.nutricao.carboidratos)} ${esc(r.observacao_diabetes || window.OBS_CARBO || '')}</p>
    </section>`;
}

function secHead(t, sub, moreHref, moreTx = 'Ver todos'){
  return `<div class="sec-h"><div><h2>${t}</h2>${sub ? `<p>${sub}</p>` : ''}</div>${moreHref ? `<a class="more" href="${moreHref}">${moreTx}</a>` : ''}</div>`;
}

    if (!bonusLiberados()) return screens.bonusBloqueado();
    return `
    <h1 class="page-t">Meus bônus</h1>
    <p class="page-s">Confira os materiais extras disponíveis no seu acesso.</p>
    <div class="bgrid sec" style="margin-top:20px">${BONUS.map(bonusCard).join('')}</div>`;
  },

  /* ---------- BÔNUS (detalhe) ---------- */
  bonus(id){
    const b = BONUS.find(x => x.id === id);
    if (!b) return screens.notFound();
    if (!bonusLiberados()) return screens.bonusBloqueado();
    // Bônus com módulo próprio: a tela inteira é montada depois do render (ver router)
    if (b.modulo === 'compras' && window.ComprasEssenciais && window.COMPRAS_ESSENCIAIS) return `<div id="comprasApp"></div>`;
    if (b.modulo === 'cardapio' && window.Cardapio30Dias && window.CARDAPIO_30_DIAS) return `<div id="cardapioApp"></div>`;
    if (b.modulo === 'substituicoes' && window.GuiaSubstituicoes && window.GUIA_SUBSTITUICOES) return `<div id="substituicoesApp"></div>`;
    return `
    <section class="phero" style="--c:#F3F7F4;--ci:${b.cor};text-align:center">
      <span class="big">${ic(b.icone, 170, 1.2)}</span>
      <div style="display:grid;place-items:center;padding:6px 0 4px">${bookCover(b, true)}</div>
      <span class="blabel" style="display:block;margin-top:18px">Bônus ${b.n}</span>
      <h1 style="margin:6px auto 0">${esc(b.nome)}</h1>
      <p style="margin:8px auto 0">${esc(b.frase)}</p>
    </section>
    <div class="actions">${dlBtn(b.arquivo, b.nome, 'Baixar ' + b.nome, 'btn')}</div>
    <section class="block">
      <h2>${ic(b.icone, 20)} Sobre este material</h2>
      <p style="margin:0 0 14px;color:var(--muted)">${esc(b.texto)}</p>
      <!-- TROCAR: conteúdo interno do bônus NÃO IDENTIFICADO (lista, cardápio por dia ou substituições) -->
      <div class="todo"><span class="tt">A cadastrar</span><br>O conteúdo deste bônus pode ser exibido aqui dentro do app. Por enquanto, abra o material pelo botão de download.</div>
    </section>`;
  },

  bonusBloqueado(){
    return `
    <div class="empty">
      <div class="ei" style="background:var(--g-l);color:var(--g)">${ic('lock', 32)}</div>
      <h3>Bônus do plano Premium</h3>
      <p>Os bônus Lista de Compras Essenciais, Cardápio de 30 Dias e Guia de Substituições fazem parte do plano +500 Receitas Premium.</p>
      <a class="btn" href="#/">Voltar ao início</a>
    </div>`;
  },

  /* ---------- DOWNLOADS ---------- */
  downloads(){
    const row = (icon, c, ci, t, d, arq) => `<div class="dl" style="--c:${c};--ci:${ci}"><span class="mic">${ic(icon, 21)}</span><div class="tx"><h3>${esc(t)}</h3><p>${d}</p></div>${dlBtn(arq, t, 'Baixar', 'btn sm')}</div>`;
    return `
    <h1 class="page-t">Downloads e impressão</h1>
    <p class="page-s">Encontre os materiais disponíveis para baixar e consultar fora do aplicativo.</p>

    <div class="group-t">Acervo completo</div>
    <div class="list">
      ${row('book', '#EFFBF1', '#008934', ACERVO.basico.nome, 'Todas as categorias em um só material', ACERVO.basico.arquivo)}
      ${CONFIG.plano === 'premium' ? row('crown', '#FFF4D6', '#9A6F00', ACERVO.premium.nome, 'Acervo do seu plano Premium', ACERVO.premium.arquivo) : ''}
    </div>

    <div class="group-t">Por categoria</div>
    <div class="list">
      ${CATEGORIAS.map(c => row(c.icone, c.c, c.ci, c.nome, c.qtd + ' receitas', c.arquivo)).join('')}
    </div>

    ${bonusLiberados() ? `
    <div class="group-t">Bônus</div>
    <div class="list">
      ${BONUS.map(b => row(b.icone, '#F3F7F4', b.cor, b.nome, 'Bônus ' + b.n, b.arquivo)).join('')}
    </div>` : ''}`;
  },

  /* ---------- COMECE POR AQUI ---------- */
  comece(){
    const how = (n, t, d) => `<div class="how"><span class="n">${n}</span><div><h3>${t}</h3><p>${d}</p></div></div>`;
    return `
    <h1 class="page-t">Comece por aqui</h1>
    <p class="page-s">Seu acervo está organizado para facilitar a rotina. Explore as categorias, encontre uma receita e salve suas preferidas para consultar quando quiser.</p>
    <div class="howto sec" style="margin-top:20px">
      ${how(1, 'Escolha uma categoria', 'São 8 categorias, do café da manhã às bebidas. Toque em uma para ver as receitas.')}
      ${how(2, 'Busque pelo nome', 'Use o campo “Qual receita você quer preparar?” no início ou na aba Receitas.')}
      ${how(3, 'Salve suas preferidas', 'Toque no coração para guardar a receita em Favoritos.')}
      ${how(4, 'Marque o que já preparou', 'Na receita, toque em “Marcar como preparada” para acompanhar o que já fez.')}
      ${how(5, 'Baixe e imprima', 'Em Downloads e impressão ficam os materiais para consultar fora do app.')}
      ${bonusLiberados() ? how(6, 'Aproveite os bônus', 'Lista de compras, cardápio e guia de substituições estão em Meus bônus.') : ''}
    </div>
    <div class="actions"><a class="btn" href="#/receitas">Ver as receitas ${ic('chev', 18, 2.6)}</a></div>`;
  },

  /* ---------- CONTA ---------- */
  conta(){
    const p = plano();
    const ini = (CONFIG.nomeAluno || 'V').trim().charAt(0).toUpperCase();
    return `
    <div class="profile">
      <span class="avatar">${esc(ini)}</span>
      <div><h2>${esc(CONFIG.nomeAluno || 'Seu acesso')}</h2><p>${esc(p.nome)}</p></div>
    </div>
    <div class="kpis">
      <div class="kpi"><b>${favs.length}</b><span>receitas favoritas</span></div>
      <div class="kpi"><b>${done.length}</b><span>receitas preparadas</span></div>
      <div class="kpi"><b>${p.qtd}</b><span>receitas no plano</span></div>
    </div>
    <div class="group-t">Seu acesso</div>
    <div class="rows">
      <div><span>Produto</span><b>${esc(CONFIG.nomeCompleto)}</b></div>
      <div><span>Plano</span><b>${esc(p.nome)}</b></div>
      <div><span>Validade</span><b>Acesso vitalício</b></div>
      <div><span>Bônus</span><b>${bonusLiberados() ? 'Liberados' : 'Não incluídos'}</b></div>
      <!-- TROCAR: e-mail/identificação do comprador (login NÃO IDENTIFICADO) -->
    </div>
    <div class="actions no-print">
      <button class="btn ghost" data-rewelcome>${ic('spark', 19)} Ver boas-vindas novamente</button>
    </div>`;
  },

  /* ---------- AJUDA ---------- */
  ajuda(){
    return `
    <h1 class="page-t">Ajuda</h1>
    <p class="page-s">Precisa de ajuda para acessar ou encontrar um material? Confira as orientações disponíveis aqui.</p>
    <div class="menu sec" style="margin-top:20px">
      <a class="mi" href="#/comece"><span class="mic">${ic('spark', 22)}</span><span class="tx"><h3>Como usar o app</h3><p>Categorias, busca, favoritos e downloads.</p></span><span class="chev">${ic('chev', 20)}</span></a>
      <a class="mi" href="#/downloads"><span class="mic">${ic('print', 22)}</span><span class="tx"><h3>Como imprimir</h3><p>Baixe o material em Downloads e impressão, ou use “Imprimir esta receita” dentro de cada receita.</p></span><span class="chev">${ic('chev', 20)}</span></a>
      <a class="mi" href="#/favoritos"><span class="mic">${ic('heart', 22)}</span><span class="tx"><h3>Onde ficam meus favoritos</h3><p>Na aba Favoritos. Eles ficam salvos neste aparelho e navegador.</p></span><span class="chev">${ic('chev', 20)}</span></a>
    </div>
    <div class="group-t">Atendimento</div>
    ${CONFIG.suporte
      ? `<div class="rows"><div><span>Fale com a gente</span><b>${esc(CONFIG.suporte)}</b></div></div>`
      : `<!-- TROCAR: canal de suporte NÃO IDENTIFICADO — preencha CONFIG.suporte -->
         <div class="todo"><span class="tt">A definir</span><br>Canal de atendimento (e-mail ou WhatsApp) a ser informado aqui.</div>`}`;
  },

  notFound(){
    return `<div class="empty"><div class="ei" style="background:var(--g-l);color:var(--g)">${ic('search', 32)}</div><h3>Página não encontrada</h3><p>Esse conteúdo não existe ou foi movido.</p><a class="btn" href="#/">Voltar ao início</a></div>`;
  }
};

/* ---------- Resultados da busca (aba Receitas) ---------- */
function renderResults(q){
  const box = $('#results');
  if (!box) return;
  const n = norm(q);
  if (!n){
    box.innerHTML = `
      <section class="sec">${secHead('Categorias', 'Escolha por onde começar.')}<div class="cats">${CATEGORIAS.map(catCard).join('')}</div></section>
      <section class="sec">${secHead('Veja o que você vai preparar')}<div class="rgrid">${RECEITAS.map(recCard).join('')}</div></section>`;
    return;
  }
  const recs = RECEITAS.filter(r => norm(r.nome + ' ' + r.desc + ' ' + (r.ingredientes || []).join(' ')).includes(n));
  const cats = CATEGORIAS.filter(c => norm(c.nome).includes(n));
  box.innerHTML = (cats.length ? `<section class="sec">${secHead('Categorias')}<div class="cats">${cats.map(catCard).join('')}</div></section>` : '')
    + (recs.length ? `<section class="sec">${secHead(`Receitas (${recs.length})`)}<div class="rgrid">${recs.map(recCard).join('')}</div></section>` : '')
    + (!recs.length && !cats.length ? `<section class="sec"><div class="empty"><div class="ei" style="background:var(--g-l);color:var(--g)">${ic('search', 32)}</div><h3>Nada encontrado para “${esc(q)}”</h3><p>Tente outro nome ou explore as categorias do acervo.</p><a class="btn" href="#/receitas">Ver categorias</a></div></section>` : '');
}

/* =========================================================
   ROTEADOR (hash — funciona abrindo o arquivo direto, sem servidor)
   ========================================================= */
const TABS = [
  { id:'home',      href:'#/',          label:'Início',    icon:'home'  },
  { id:'receitas',  href:'#/receitas',  label:'Receitas',  icon:'book'  },
  { id:'favoritos', href:'#/favoritos', label:'Favoritos', icon:'heart' },
  { id:'mais',      href:'#/mais',      label:'Mais',      icon:'grid'  }
];
const TAB_OF = { '':'home', receitas:'receitas', categoria:'receitas', receita:'receitas', favoritos:'favoritos',
                 mais:'mais', bonus:'mais', downloads:'mais', conta:'mais', ajuda:'mais', comece:'mais' };
const ROOTS = ['', 'receitas', 'favoritos', 'mais'];

function renderNav(active){
  const html = cls => TABS.map(t => `<a href="${t.href}" class="${t.id === active ? 'on' : ''}">${cls ? `<span class="bi">${ic(t.icon, 22)}</span>` : ic(t.icon, 18)}${t.label}</a>`).join('');
  $('#bnav').innerHTML = html(true);
  $('#topnav').innerHTML = html(false);
}

function route(){
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  const [base = '', arg] = path.split('/');
  const q = new URLSearchParams(qs || '').get('q') || '';

  let html;
  switch (base){
    case '':          html = screens.home(); break;
    case 'receitas':  html = screens.receitas(q); break;
    case 'categoria': html = screens.categoria(arg); break;
    case 'receita':
      html = screens.receita(arg);
      if (recById(arg)){ recent = [arg, ...recent.filter(x => x !== arg)].slice(0, 8); store.set('recent', recent); }
      break;
    case 'favoritos': html = screens.favoritos(); break;
    case 'mais':      html = screens.mais(); break;
    case 'bonus':     html = arg ? screens.bonus(arg) : screens.bonusLista(); break;
    case 'downloads': html = screens.downloads(); break;
    case 'comece':    html = screens.comece(); break;
    case 'conta':     html = screens.conta(); break;
    case 'ajuda':     html = screens.ajuda(); break;
    default:          html = screens.notFound();
  }

  const view = $('#view');
  view.innerHTML = `<div class="screen">${html}</div>`;
  renderNav(TAB_OF[base] || 'home');
  $('#backBtn').hidden = ROOTS.includes(base);
  window.scrollTo(0, 0);

  if (base === 'receitas'){
    renderResults(q);
    const inp = $('#liveSearch');
    inp.addEventListener('input', () => renderResults(inp.value));
    if (q) inp.focus();
  }
  const comprasHost = $('#comprasApp');
  if (comprasHost){
    ComprasEssenciais.mount(comprasHost, window.COMPRAS_ESSENCIAIS, { assetBase: 'img/bonus/compras/' });
    // Links internos do módulo (#ce-...) rolam a tela em vez de mudar a rota do app
    comprasHost.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#ce-"]');
      if (!a) return;
      e.preventDefault();
      const alvo = comprasHost.querySelector(a.getAttribute('href'));
      if (alvo) alvo.scrollIntoView({ behavior: 'smooth' });
    });
  }
  const cardapioHost = $('#cardapioApp');
  if (cardapioHost) Cardapio30Dias.mount(cardapioHost, window.CARDAPIO_30_DIAS, { assetBase: 'img/bonus/cardapio/' });
  const substituicoesHost = $('#substituicoesApp');
  if (substituicoesHost) GuiaSubstituicoes.mount(substituicoesHost, window.GUIA_SUBSTITUICOES, { assetBase: 'img/bonus/substituicoes/' });
  const cs = $('#catSearch');
  if (cs){
    const all = RECEITAS.filter(r => r.categoria === arg);
    let sub = '';
    const draw = () => {
      const n = norm(cs.value);
      $('#catList').innerHTML = all.filter(r => (!sub || r.subcategoria === sub) && norm(r.nome).includes(n)).map(recCard).join('') || '<p class="page-s">Nenhuma receita com esse nome nesta categoria.</p>';
    };
    cs.addEventListener('input', draw);
    const subsBox = $('#catSubs');
    if (subsBox) subsBox.addEventListener('click', e => {
      const b = e.target.closest('[data-sub]');
      if (!b) return;
      sub = b.dataset.sub;
      subsBox.querySelectorAll('[data-sub]').forEach(x => x.classList.toggle('on', x === b));
      draw();
    });
  }
}

/* =========================================================
   INTERAÇÕES (delegação de eventos)
   ========================================================= */
document.addEventListener('click', e => {
  // Favoritar
  const f = e.target.closest('[data-fav]');
  if (f){
    e.preventDefault(); e.stopPropagation();
    const id = f.dataset.fav;
    const on = !favs.includes(id);
    favs = on ? [id, ...favs] : favs.filter(x => x !== id);
    store.set('fav', favs);
    document.querySelectorAll(`[data-fav="${id}"]`).forEach(el => {
      el.classList.toggle('on', on);
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
      const s = el.querySelector('span'); if (s && el.hasAttribute('data-big')) s.textContent = on ? 'Nos favoritos' : 'Favoritar';
    });
    toast(on ? 'Receita salva nos favoritos' : 'Removida dos favoritos');
    return;
  }
  // Já preparei
  const d = e.target.closest('[data-done]');
  if (d){
    const id = d.dataset.done;
    const on = !done.includes(id);
    done = on ? [id, ...done] : done.filter(x => x !== id);
    store.set('done', done);
    d.classList.toggle('on', on);
    d.querySelector('span').textContent = on ? 'Já preparei' : 'Marcar como preparada';
    toast(on ? 'Boa! Receita marcada como preparada' : 'Marcação removida');
    return;
  }
  // Download com link ainda não configurado
  const a = e.target.closest('a[data-arquivo]');
  if (a && (a.getAttribute('href') === '#' || !a.getAttribute('href'))){
    e.preventDefault();
    toast('Link de download ainda não configurado: ' + a.dataset.arquivo);
    return;
  }
  if (e.target.closest('[data-rewelcome]')) showWelcome();
});

// Busca da home → abre a aba Receitas com o termo
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-search]');
  if (!form) return;
  e.preventDefault();
  const q = form.q.value.trim();
  location.hash = '#/receitas' + (q ? '?q=' + encodeURIComponent(q) : '');
});

$('#backBtn').innerHTML = ic('back', 22, 2.4);
$('#backBtn').addEventListener('click', () => {
  if (history.length > 1) history.back(); else location.hash = '#/';
});

/* ---------- Boas-vindas (primeiro acesso) ---------- */
function showWelcome(){
  const w = $('#welcome');
  $('#welcomeProd').innerHTML = `${esc(CONFIG.nomeCompleto)}<small>${esc(plano().nome)} · Acesso vitalício</small>`;
  // confetes discretos nas cores da marca
  w.querySelectorAll('.spark').forEach(s => s.remove());
  const cores = ['#FFFFFF', '#B8F5C9', '#E9A800', '#7EE2A0'];
  for (let i = 0; i < 18; i++){
    const s = document.createElement('i');
    s.className = 'spark';
    s.style.cssText = `left:${Math.random() * 100}%;top:0;background:${cores[i % 4]};animation-delay:${Math.random() * 3.6}s;animation-duration:${3 + Math.random() * 2}s`;
    w.appendChild(s);
  }
  w.classList.remove('out');
  w.hidden = false;
}
$('#welcomeGo').addEventListener('click', () => {
  store.set('welcomed', true);
  const w = $('#welcome');
  w.classList.add('out');
  setTimeout(() => { w.hidden = true; }, 350);
});

window.addEventListener('hashchange', route);
route();
if (!store.get('welcomed', false)) showWelcome();
</script>
</body>
</html>
